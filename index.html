<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Serialized fiction, a chapter at a time." />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&display=swap"
      rel="stylesheet"
    />
    <title>Publishd</title>
    <!--
      Counterpart to public/404.html (see the comment there for the full
      explanation of the spa-github-pages trick). If we were redirected here
      from 404.html, the real path is encoded in the query string as
      "?/real/path&query=params". Decode it and restore the real URL via
      history.replaceState *before* React (and React Router) mounts, so the
      app boots on the correct route. No-op on Vercel/normal navigation,
      where location.search never starts with "?/".
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
          window.history.replaceState(
            null,
            '',
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
